application:
  name: dozycoffee

datasource:
  driver: com.mysql.cj.jdbc.Driver
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dozycoffee